<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gurukripa Restaurant – Management</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/main.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
</head>
<body>
  <div id="app">
    <div style="min-height:100vh;display:flex;align-items:center;justify-content:center;font-family:system-ui,sans-serif;color:#6b7280;">
      Loading Gurukripa...
    </div>
  </div>
  <div id="toast-container" class="toast-container"></div>
  <div id="modal-root"></div>
  <script src="js/bundle.js"></script>
  <script>
    window.addEventListener('error', function(e) {
      var app = document.getElementById('app');
      if (app && app.innerText.indexOf('Loading') !== -1) {
        app.innerHTML = '<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;padding:2rem;font-family:system-ui,sans-serif;">' +
          '<div style="max-width:480px;text-align:center;"><h2 style="color:#dc2626;">Failed to load app</h2>' +
          '<p style="color:#6b7280;margin:1rem 0;">' + (e.message || 'Unknown error') + '</p>' +
          '<p style="font-size:0.85rem;color:#9ca3af;">Make sure <code>js/bundle.js</code> and <code>css/main.css</code> are in the same folder as index.html.</p></div></div>';
      }
    });
  </script>
</body>
</html>
